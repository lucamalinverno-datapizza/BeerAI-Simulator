 with the smallest ID; if none, no more batches that day. No uncovered orders \u2192 no production.","Coverage is a quantity reservation: a future batch does not make a delivery on time. Timing comes from simulated events.","Unavailability forbids batches whose occupancy + cleaning intersects [start, end). Overlap with an initial batch is reported as an inconsistent configuration (never silently fixed).","100% yield, no waste, raw materials always available, no staff or transport constraints, no transport time, no costs or ROI.","Added resources (e.g. F5) are counterfactual: available from day 0, no purchase or installation time.","Service level (volume) = on-time volume / demand due in the period. Orders complete on time = fully delivered by due day / orders due in the period. Final backlog = due demand \u2212 delivered (not the volume delivered late).","Tank utilisation uses time intervals: each day-interval [d, d+1) of the window [0, horizon) is classified as residence, cleaning, unavailable or idle.","Lot \u2192 customer traceability allocates packaged stock FIFO; it does not change any quantity.","High occupancy is a candidate bottleneck, not proof: the counterfactual comparison shows the effect of adding capacity.","Production equipment reads engine snapshots. Tank level = volume / capacity (it does not drop during fermentation). Pipe pulses, bottles and trucks illustrate daily events. Walking staff are illustrative and do not change production capacity. No temperature/pressure sensors or valve controls exist in this model."]},diag:{title:"Diagnostics",runInfo:"Run information",config:"Configuration (JSON)",kpis:"KPIs (JSON)",events:"Events (JSON)"},webgl:{unavailable:"WebGL is not available in this browser \u2014 showing the 2D control room with the same engine and presets.",lost:"The 3D graphics context was lost. Switch to the 2D control room (same data) or try 3D again.",crashed:"The 3D scene failed to initialise. The 2D control room uses the same engine an
